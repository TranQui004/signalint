name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (must start with v and match package.json, e.g. v1.1.2)'
        required: true

permissions:
  contents: read

jobs:
  gate:
    name: Verify (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: '22.x'
            label: windows-latest
          - os: ubuntu-latest
            node: '22.x'
            label: ubuntu-latest
          - os: macos-latest
            node: '22.x'
            label: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.x'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs

      - name: Build
        run: pnpm build

      - name: Pack and inspect release tarball
        id: pack-tarball
        run: |
          mkdir -p .tarball-inspect
          pack_output="$(npm pack --json)"
          echo "$pack_output" > .tarball-inspect/pack.json
          tarball="$(node -p "JSON.parse(require('fs').readFileSync('.tarball-inspect/pack.json', 'utf8'))[0].filename")"
          if [ -z "$tarball" ] || [ ! -f "$tarball" ]; then
            echo "Failed to generate npm tarball." >&2
            exit 1
          fi
          integrity="$(node -e "const crypto = require('crypto'); const fs = require('fs'); const hash = crypto.createHash('sha512').update(fs.readFileSync('$tarball')).digest('base64'); console.log('sha512-' + hash);")"
          echo "Tarball: $tarball"
          echo "SHA-512 integrity: $integrity"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
          tar -xzf "$tarball" -C .tarball-inspect
          if [ ! -f ".tarball-inspect/package/package.json" ] || [ ! -f ".tarball-inspect/package/dist/src/index.js" ]; then
            echo "Tarball inspection failed: expected files missing." >&2
            exit 1
          fi
          echo "Tarball unpacked and verified successfully."

      - name: Generate release notes from commit messages
        run: |
          ref_name="${RELEASE_TAG:-${{ inputs.tag || github.ref_name }}}"
          previous_tag="$(git describe --tags --abbrev=0 "${ref_name}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            range_opts=("${previous_tag}..${ref_name}")
            echo "Changes since ${previous_tag}:" > release-notes.md
          else
            # No earlier tag reachable (for example after retiring old tags): cap
            # the range so the notes do not expand to the entire history.
            range_opts=(-n 200 "${ref_name}")
            echo "Changes in the most recent 200 commits:" > release-notes.md
          fi
          echo "" >> release-notes.md
          for type in feat fix refactor test docs ci; do
            matches="$(git log --no-merges --pretty=format:'%s' "${range_opts[@]}" | grep -E "^${type}(\(.+\))?: " || true)"
            if [ -n "$matches" ]; then
              case "$type" in
                feat) heading="Features" ;;
                fix) heading="Fixes" ;;
                refactor) heading="Refactoring" ;;
                test) heading="Tests" ;;
                docs) heading="Documentation" ;;
                ci) heading="CI" ;;
              esac
              echo "### ${heading}" >> release-notes.md
              echo "$matches" | sed 's/^/- /' >> release-notes.md
              echo "" >> release-notes.md
            fi
          done
          other="$(git log --no-merges --pretty=format:'%s' "${range_opts[@]}" | grep -Ev "^(feat|fix|refactor|test|docs|ci)(\(.+\))?: " || true)"
          if [ -n "$other" ]; then
            echo "### Other" >> release-notes.md
            echo "$other" | sed 's/^/- /' >> release-notes.md
            echo "" >> release-notes.md
          fi
          cat release-notes.md

      - name: Check if already published on npm
        id: check-publish
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "signalint-mcp@$package_version" version >/dev/null 2>&1; then
            echo "Version $package_version is already published on npm. Skipping npm publish."
            echo "skip_npm_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $package_version is NOT published on npm. Proceeding."
            echo "skip_npm_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm token secret is configured
        if: steps.check-publish.outputs.skip_npm_publish != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is not set; add an npm automation token before tagging a release." >&2
            exit 1
          fi

      - name: Publish to npm
        if: steps.check-publish.outputs.skip_npm_publish != 'true'
        run: npm publish "${{ steps.pack-tarball.outputs.tarball }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify server.json version matches package.json
        run: |
          server_version="$(node -p "require('./server.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$server_version" != "$package_version" ]; then
            echo "server.json version $server_version does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          PUBLISHER_VERSION="v1.8.1"
          EXPECTED_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${EXPECTED_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          package_version="$(node -p "require('./package.json').version")"
          registry_version="$(node -e "fetch('https://registry.modelcontextprotocol.io/v0.1/servers/io.github.TranQui004%2Fsignalint/versions/latest').then(r => r.json()).then(d => console.log(d.server?.version || '')).catch(() => '')" || true)"
          if [ "$registry_version" = "$package_version" ]; then
            echo "Version $package_version is already published on MCP Registry. Skipping."
            exit 0
          fi

          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            echo "Publishing to MCP Registry (attempt $attempt)..."
            if ./mcp-publisher publish; then
              echo "Successfully published to MCP Registry"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Publish attempt $attempt failed (likely npm metadata propagation delay). Retrying in 15s..."
              sleep 15
            fi
          done
          echo "Failed to publish to MCP Registry after 5 attempts." >&2
          exit 1

      - name: Create GitHub Release
        run: |
          ref_name="${RELEASE_TAG:-${{ inputs.tag || github.ref_name }}}"
          if gh release view "$ref_name" > /dev/null 2>&1; then
            echo "Release $ref_name already exists; mutable tag/release overwrites are disallowed." >&2
            exit 1
          fi
          gh release create "$ref_name" --title "$ref_name" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
